<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <meta name="theme-color" content="#fff5f8">
        <title>Freezy Breezy Booth — Your little photo moment</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
        <!-- <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Pacifico&display=swap" rel="stylesheet"> -->

        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="shell">
            <header class="brand">
                <div class="logo">
                    <span class="flower">✿</span> freezy breezy booth<span style="color:#d95b88">.</span>
                </div>
                <div class="pill">MAKE A LITTLE MEMORY ✦</div>
            </header>

            <div class="progress-wrap">
                <div class="progress-label">
                    <span id="progressName">Let's begin</span>
                    <span id="progressNum">01 / 06</span>
                </div>
                <div class="track">
                    <div id="progressBar"></div>
                </div>
            </div>

            <main id="main" aria-live="polite"></main>

            <footer class="footer">
                <span>✿ made for your favorite moments</span>
                <span>private by design · photos stay in your browser</span>
            </footer>
        </div>

        <script src="script.js" defer></script>
    </body>
</html>
